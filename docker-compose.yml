services:
  lorekeeper_api:
    container_name: lorekeeper_api
    build:
      context: ./backend
      dockerfile: ./docker/Dockerfile
    ports:
      - ${EXPOSE_PORT}:${PORT}
    restart: on-failure
    volumes:
      - ./backend/:/app/
    depends_on:
      - lorekeeper_mysql
    env_file:
      - .env
    environment:
      - DB_CONNECTION=${DB_HOST}:${DB_PORT}
      - WAIT_HOSTS=${DB_HOST}:${DB_PORT}
      - WAIT_BEFORE_HOSTS=5
      - WAIT_SLEEP_INTERVAL=5
    networks:
      - lorekeeper-stack

  lorekeeper_mysql:
    image: mysql:8.0
    container_name: lorekeeper_db
    ports:
      - ${EXPOSE_DB_PORT}:${DB_PORT}
    environment:
      - MYSQL_ROOT_HOST=${DB_HOST}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    volumes:
      - database_mysql:/var/lib/mysql
    networks:
      - lorekeeper-stack

volumes:
  database_mysql:

networks:
  lorekeeper-stack:
    driver: bridge